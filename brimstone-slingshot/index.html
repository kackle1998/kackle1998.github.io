<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Brimstone Slingshot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <style id="loading">body { visibility: hidden }</style>
</head>
<body>
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div id="stage">
    <div id="screenWrap">
    <div id="game" class="hidden">
      <div id="left">
        <div id="cpuPanel" class="ppanel panel" data-player="1"></div>
        <div id="turnBox" class="panel">
          <button id="bell"><img id="bellImg" alt=""></button>
          <div id="turnInfo"></div>
          <div class="tb-btns">
            <button id="gearBtn" class="mini-btn"><img id="gearImg" alt=""></button>
            <button id="concedeBtn" class="mini-btn">&#9873;</button>
          </div>
        </div>
        <div id="youPanel" class="ppanel panel" data-player="0"></div>
      </div>
      <div id="board">
        <div class="row-head"><span class="row-label">THE DEALER</span><div class="traps" id="cpuTraps"></div></div>
        <div class="row" id="cpuRow"></div>
        <div class="divider"><div id="callout" aria-live="polite"></div></div>
        <div class="row" id="youRow"></div>
        <div class="row-head"><span class="row-label bottom">YOU</span><div class="traps" id="youTraps"></div></div>
      </div>
      <div id="right">
        <div id="inspector" class="panel"></div>
        <div id="log" class="panel"></div>
      </div>
      <div id="hand"></div>
      <div id="banner"></div>
    </div>
    <div id="screen" class="overlay"></div>
    <div id="fx"></div>
    <div id="toast"></div>
    </div>
    <div id="crt" aria-hidden="true">
      <div class="crt-scan"></div>
      <div class="crt-roll"></div>
      <div id="crtFlicker"></div>
      <div id="crtFlash"></div>
      <div class="crt-tube"></div>
    </div>
  </div>

  <script>
  // Loads the styles and scripts in order, asking the server each time whether they changed, so a
  // phone never keeps running an old copy after an update (an unchanged file costs a 304).
  (() => {
    const FILES = [
    'style.css', 'cardmaker.css', 'js/data.js', 'js/custom.js', 'js/config.js', 'js/cloud.js',
    'js/render.js', 'js/engine.js', 'js/ai.js', 'js/crt.js', 'js/pixeleditor.js', 'js/deckbuilder.js',
    'js/cardmaker.js', 'js/charmaker.js', 'js/options.js', 'js/run.js', 'js/runmap.js', 'js/scene.js',
    'js/settings.js', 'js/bowl.js', 'js/casino.js', 'js/draft.js', 'js/dip.js', 'js/moth.js',
    'js/factory.js', 'js/rune.js', 'js/forge.js', 'js/shrine.js', 'js/handover.js', 'js/campfire.js',
    'js/fire.js', 'js/props.js', 'js/idol.js', 'js/tank-art.js', 'js/tank.js', 'js/ui.js',
    'js/netplay.js',
    ];
    const add = (f, text) => {
      const css = f.endsWith('.css'), el = document.createElement(css ? 'style' : 'script');
      if (text != null) el.textContent = text + (css ? '' : '\n//# sourceURL=' + f);
      else if (css) return document.head.insertAdjacentHTML('beforeend', `<link rel="stylesheet" href="${f}">`);
      else { el.src = f; el.async = false; }
      (css ? document.head : document.body).appendChild(el);
    };
    const shown = () => document.getElementById('loading').remove();
    Promise.all(FILES.map((f) => fetch(f, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw r; return r.text(); })))
      .then((texts) => { FILES.forEach((f, i) => add(f, texts[i])); shown(); })
      .catch(() => { FILES.forEach((f) => add(f, null)); shown(); }); // opened as a plain file: load them the usual way
  })();
  </script>
</body>
</html>
