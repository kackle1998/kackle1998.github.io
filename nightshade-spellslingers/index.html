<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nightshade Spellslinging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div id="stage">
    <div id="screenWrap">
    <div id="game" class="hidden">
      <div id="left">
        <div id="cpuPanel" class="ppanel panel" data-player="1"></div>
        <div id="turnBox" class="panel">
          <button id="bell" title="Ring to end your turn (Space)"><img id="bellImg" alt="End turn"></button>
          <div id="turnInfo"></div>
          <div class="tb-btns">
            <button id="helpBtn" class="mini-btn" title="How to play">?</button>
            <button id="muteBtn" class="mini-btn" title="Sound on/off">&#9835;</button>
            <button id="crtBtn" class="mini-btn" title="CRT effect on/off">TV</button>
            <button id="concedeBtn" class="mini-btn" title="Concede and return to the main menu">&#9873;</button>
          </div>
        </div>
        <div id="youPanel" class="ppanel panel" data-player="0"></div>
      </div>
      <div id="board">
        <div class="row-head"><span class="row-label">THE DEALER</span><div class="traps" id="cpuTraps" title="The Dealer's face-down traps"></div></div>
        <div class="row" id="cpuRow"></div>
        <div class="divider"></div>
        <div class="row" id="youRow"></div>
        <div class="row-head"><span class="row-label bottom">YOU</span><div class="traps" id="youTraps" title="Your traps"></div></div>
      </div>
      <div id="right">
        <div id="inspector" class="panel"></div>
        <div id="log" class="panel"></div>
      </div>
      <div id="hand"></div>
      <div id="banner"></div>
    </div>
    <div id="screen" class="overlay"></div>
    <div id="fx"></div>
    <div id="toast"></div>
    </div>
    <div id="crt" aria-hidden="true">
      <div class="crt-scan"></div>
      <div class="crt-roll"></div>
      <div id="crtFlicker"></div>
      <div id="crtFlash"></div>
      <div class="crt-tube"></div>
    </div>
  </div>
  <iframe id="maker" class="hidden" title="Card and character maker"></iframe>

  <script src="js/data.js"></script>
  <script src="js/custom.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/render.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/crt.js"></script>
  <script src="js/pixeleditor.js"></script>
  <script src="js/deckbuilder.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/netplay.js"></script>
</body>
</html>
